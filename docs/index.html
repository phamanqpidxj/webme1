<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đèn Kéo Quân - 3D Rotating Lantern</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --face-width: min(300px, 40vw, 45svh);
            min-height: 100svh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 24px;
            padding: 24px 16px;
            text-align: center;
        }

        .container {
            perspective: 1200px;
            width: 100%;
            min-height: calc(var(--face-width) * 1.8);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lantern {
            width: var(--face-width);
            height: calc(var(--face-width) * 4 / 3);
            position: relative;
            transform-style: preserve-3d;
            animation: rotate 15s linear infinite;
        }

        .lantern.paused {
            animation-play-state: paused;
        }

        @keyframes rotate {
            from {
                transform: rotateY(0deg);
            }
            to {
                transform: rotateY(360deg);
            }
        }

        .face {
            position: absolute;
            width: var(--face-width);
            height: calc(var(--face-width) * 4 / 3);
            background-size: cover;
            background-position: center;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            transition: transform 0.3s, box-shadow 0.3s;
            overflow: hidden;
        }

        .face:hover {
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.5);
        }

        .face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Positioning 6 faces around hexagon */
        .face:nth-of-type(1) {
            transform: rotateY(0deg) translateZ(calc(var(--face-width) * 0.8666667));
            background: linear-gradient(45deg, #ff6b6b, #ee5a6f);
        }

        .face:nth-of-type(2) {
            transform: rotateY(60deg) translateZ(calc(var(--face-width) * 0.8666667));
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
        }

        .face:nth-of-type(3) {
            transform: rotateY(120deg) translateZ(calc(var(--face-width) * 0.8666667));
            background: linear-gradient(45deg, #f7b731, #f39c12);
        }

        .face:nth-of-type(4) {
            transform: rotateY(180deg) translateZ(calc(var(--face-width) * 0.8666667));
            background: linear-gradient(45deg, #5f27cd, #341f97);
        }

        .face:nth-of-type(5) {
            transform: rotateY(240deg) translateZ(calc(var(--face-width) * 0.8666667));
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
        }

        .face:nth-of-type(6) {
            transform: rotateY(300deg) translateZ(calc(var(--face-width) * 0.8666667));
            background: linear-gradient(45deg, #fa8bff, #2bd2ff);
        }

        .title {
            color: white;
            font-size: clamp(22px, 4vw, 36px);
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .instruction {
            justify-self: center;
            max-width: 100%;
            color: white;
            font-size: clamp(16px, 2vw, 18px);
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            border-radius: 10px;
        }

        button {
            display: block;
            margin: 0 auto 12px;
            min-height: 44px;
            padding: 10px 24px;
            border: 2px solid white;
            border-radius: 8px;
            background: white;
            color: #45216b;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        button:focus-visible {
            outline: 3px solid #ffdf6e;
            outline-offset: 4px;
        }

        @media (prefers-reduced-motion: reduce) {
            .lantern { animation-play-state: paused; }
            .lantern.playing { animation-play-state: running; }
        }

        /* Light effect */
        .light {
            position: absolute;
            top: -48px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 48px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.8), transparent);
        }
    </style>
</head>
<body>
    <h1 class="title">🏮 Đèn Kéo Quân - Phạm An 🏮</h1>
    
    <div class="container">
        <div class="lantern" id="lantern">
            <span class="light" aria-hidden="true"></span>
            
            <div class="face">
                <img src="https://i.imgflip.com/2/30b1gx.jpg" alt="Meme 1">
            </div>
            <div class="face">
                <img src="https://i.imgflip.com/2/1bij.jpg" alt="Meme 2">
            </div>
            <div class="face">
                <img src="https://i.imgflip.com/2/1bgw.jpg" alt="Meme 3">
            </div>
            <div class="face">
                <img src="https://i.imgflip.com/2/5c7lwq.jpg" alt="Meme 4">
            </div>
            <div class="face">
                <img src="https://i.imgflip.com/2/1g8my4.jpg" alt="Meme 5">
            </div>
            <div class="face">
                <img src="https://i.imgflip.com/2/26am.jpg" alt="Meme 6">
            </div>
        </div>
    </div>

    <div class="instruction">
        <button id="toggle-rotation" type="button" aria-controls="lantern" aria-pressed="false">Tạm dừng</button>
        💡 Dùng nút để dừng hoặc tiếp tục quay.<br>
        Di chuột vào hình để tạm dừng khi xem.
    </div>

    <script>
        const lantern = document.getElementById('lantern');
        const faces = document.querySelectorAll('.face');

        const toggle = document.getElementById('toggle-rotation');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        let paused = reducedMotion.matches;
        let hovered = false;

        function updateRotation() {
            const stopped = paused || hovered;
            lantern.classList.toggle('paused', stopped);
            lantern.classList.toggle('playing', !stopped);
            toggle.setAttribute('aria-pressed', String(paused));
            toggle.textContent = paused ? 'Tiếp tục' : 'Tạm dừng';
        }

        toggle.addEventListener('click', () => {
            paused = !paused;
            updateRotation();
        });

        faces.forEach(face => {
            face.addEventListener('pointerenter', event => {
                if (event.pointerType !== 'mouse') return;
                hovered = true;
                updateRotation();
            });
            face.addEventListener('pointerleave', event => {
                if (event.pointerType !== 'mouse') return;
                hovered = false;
                updateRotation();
            });
        });

        reducedMotion.addEventListener('change', event => {
            paused = event.matches;
            updateRotation();
        });

        updateRotation();
    </script>
</body>
</html>
